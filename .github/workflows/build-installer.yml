name: Build Installer

# Gera KorvonMacro-Setup-<versao>.exe (Inno Setup).
# Em tags v* também publica o instalador na GitHub Release correspondente.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Definir versão
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $m) { throw "Versão não encontrada em Cargo.toml" }
            $version = $m.Matches[0].Groups[1].Value
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versão: $version"

      - name: Compilar (Release)
        run: cargo build --release --locked -p korvon-app

      - name: Preparar arquivos do instalador
        shell: pwsh
        run: ./installer/prepare-installer.ps1

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup ($LASTEXITCODE)" }
          }

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=$env:VERSION" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou ($LASTEXITCODE)" }
          if (-not (Test-Path "output\KorvonMacro-Setup-$env:VERSION.exe")) { throw "Instalador não foi gerado" }

      - uses: actions/upload-artifact@v4
        with:
          name: KorvonMacro-Setup-${{ env.VERSION }}
          path: output/KorvonMacro-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $file = "output\KorvonMacro-Setup-$env:VERSION.exe"
          $tag = $env:GITHUB_REF_NAME
          for ($i = 0; $i -lt 3; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $file --clobber
            } else {
              gh release create $tag $file --target $env:GITHUB_SHA --title "Korvon Macro $tag" --generate-notes
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5   # outra execução (release.yml) pode ter criado a release ao mesmo tempo
          }
          throw "Falha ao publicar a release"
