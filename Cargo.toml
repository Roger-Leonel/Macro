[workspace]
resolver = "2"
members = ["crates/korvon-core", "crates/korvon-input", "crates/korvon-app"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
opt-level = 1

# Bibliotecas (iced, wgpu, etc.) otimizadas mesmo no `cargo run`: a interface fica fluida.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
