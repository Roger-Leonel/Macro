name: Release

# Publica uma release com o instalador MSI do Windows quando uma tag v* é enviada
# (git tag v1.2.3 && git push origin v1.2.3). Também pode ser disparado à mão
# em Actions → Release → Run workflow, informando a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0). Criada se não existir."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked -p korvon-app

      - name: Gerar instalador MSI
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build installer\korvon-macro.wxs -arch x64 -d Version=$version -d ExePath=target\release\korvon-macro.exe -o "dist\korvon-macro-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix falhou ($LASTEXITCODE)" }

      - name: Publicar release
        shell: pwsh
        run: |
          $msi = "dist\korvon-macro-$($env:TAG.TrimStart('v'))-x64.msi"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $msi --clobber
          } else {
            gh release create $env:TAG $msi --target $env:GITHUB_SHA --title "Korvon Macro $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh falhou ($LASTEXITCODE)" }
