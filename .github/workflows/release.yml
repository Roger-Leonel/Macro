name: Release

# Compila uma vez e publica na GitHub Release o instalador Inno Setup (.exe) e o MSI
# quando uma tag v* é enviada (git tag v1.2.3 && git push origin v1.2.3).
# Também pode ser disparado à mão em Actions → Release → Run workflow, informando a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0). Criada se não existir."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Definir versão
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versão: $version"

      - name: Compilar
        run: cargo build --release --locked -p korvon-app

      - name: Gerar instalador MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force dist | Out-Null
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension falhou ($LASTEXITCODE)" }
          wix build installer\korvon-macro.wxs -ext WixToolset.UI.wixext -arch x64 -d Version=$env:VERSION -d ExePath=target\release\korvon-macro.exe -o "dist\korvon-macro-$env:VERSION-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix falhou ($LASTEXITCODE)" }

      - name: Preparar arquivos do instalador
        shell: pwsh
        run: ./installer/prepare-installer.ps1

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup ($LASTEXITCODE)" }
          }

      - name: Gerar instalador Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=$env:VERSION" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou ($LASTEXITCODE)" }
          if (-not (Test-Path "output\KorvonMacro-Setup-$env:VERSION.exe")) { throw "Instalador não foi gerado" }

      - uses: actions/upload-artifact@v4
        with:
          name: KorvonMacro-${{ env.VERSION }}
          path: |
            output/KorvonMacro-Setup-${{ env.VERSION }}.exe
            dist/korvon-macro-${{ env.VERSION }}-x64.msi
          if-no-files-found: error

      - name: Publicar release
        shell: pwsh
        run: |
          $files = @("output\KorvonMacro-Setup-$env:VERSION.exe", "dist\korvon-macro-$env:VERSION-x64.msi")
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
          } else {
            gh release create $env:TAG $files --target $env:GITHUB_SHA --title "Korvon Macro $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh falhou ($LASTEXITCODE)" }
