name: Release

# Publica uma release com o instalador do Windows quando uma tag v* é enviada
# (git tag v1.2.3 && git push origin v1.2.3). Também pode ser disparado à mão
# em Actions → Release → Run workflow, informando a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0). Criada se não existir."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked -p korvon-app

      - name: Gerar instalador
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\korvon-macro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }

      - name: Publicar release
        shell: pwsh
        run: |
          $setup = "dist\korvon-macro-setup-$($env:TAG.TrimStart('v')).exe"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $setup --clobber
          } else {
            gh release create $env:TAG $setup --target $env:GITHUB_SHA --title "Korvon Macro $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh falhou ($LASTEXITCODE)" }
